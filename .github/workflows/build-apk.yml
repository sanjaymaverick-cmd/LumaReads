name: Build LumaRead APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '(^e: |error: )' build.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LumaRead-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaRead-APK
          path: LumaRead-debug.apk
          if-no-files-found: error
          retention-days: 30
